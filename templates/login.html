{% extends "base.html" %}
{% block title %}Log In — AGRICONNECT{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card-agri p-4 p-md-5">
            <h2 class="mb-1" style="font-size:1.6rem;">Welcome back</h2>
            <p class="text-muted-agri mb-4">Log in to your AGRICONNECT account.</p>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control phone-input" id="phone" name="phone"
                           placeholder="10-digit mobile number" maxlength="10" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" required>
                        <button type="button" class="btn btn-agri-outline toggle-password" data-target="password">Show</button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                    <label class="form-check-label text-muted-agri" for="remember_me">Remember me on this device</label>
                </div>
                <button type="submit" class="btn btn-agri-primary w-100 py-2">Log In</button>
            </form>
            <p class="text-center mt-4 mb-0">
                Don't have an account? <a href="{{ url_for('signup') }}" class="link-agri">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
