{% extends "base.html" %}
{% block title %}Edit Profile — AGRICONNECT{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-agri p-4 p-md-5">
            <h2 class="mb-1" style="font-size:1.6rem;">Edit Profile</h2>
            <p class="text-muted-agri mb-4">Update your name or phone number.</p>
            <form method="POST" action="{{ url_for('edit_profile') }}">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>
                <div class="mb-4">
                    <label for="phone" class="form-label fw-semibold">Phone Number</label>
                    <input type="tel" class="form-control phone-input" id="phone" name="phone"
                           value="{{ user.phone }}" maxlength="10" required>
                    <div class="form-text text-muted-agri">Must be exactly 10 digits, numbers only.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Role</label>
                    <input type="text" class="form-control" value="{{ user.role|capitalize }}" disabled>
                    <div class="form-text text-muted-agri">Role cannot be changed after signup.</div>
                </div>
                <button type="submit" class="btn btn-agri-primary w-100 py-2">Save Changes</button>
            </form>
            <p class="text-center mt-4 mb-0"><a href="{{ url_for('dashboard') }}" class="link-agri">← Back to Dashboard</a></p>
        </div>
    </div>
</div>
{% endblock %}
