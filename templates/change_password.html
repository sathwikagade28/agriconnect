{% extends "base.html" %}
{% block title %}Change Password — AGRICONNECT{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card-agri p-4 p-md-5">
            <h2 class="mb-1" style="font-size:1.6rem;">Change Password</h2>
            <p class="text-muted-agri mb-4">You'll need to log in again after changing your password.</p>
            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="mb-3">
                    <label for="current_password" class="form-label fw-semibold">Current Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="current_password" name="current_password" required>
                        <button type="button" class="btn btn-agri-outline toggle-password" data-target="current_password">Show</button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="new_password" name="new_password" required>
                        <button type="button" class="btn btn-agri-outline toggle-password" data-target="new_password">Show</button>
                    </div>
                    <div class="form-text text-muted-agri">At least 6 characters.</div>
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        <button type="button" class="btn btn-agri-outline toggle-password" data-target="confirm_password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-agri-primary w-100 py-2">Update Password</button>
            </form>
            <p class="text-center mt-4 mb-0"><a href="{{ url_for('dashboard') }}" class="link-agri">← Back to Dashboard</a></p>
        </div>
    </div>
</div>
{% endblock %}
